<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #141414;
  --surface:     #1E1E1E;
  --border:      rgba(255,255,255,0.07);
  --ink:         #111111;
  --fg:          #FAFAF8;
  --fg-mid:      rgba(255,255,255,0.45);
  --fg-faint:    rgba(255,255,255,0.18);

  /* Card backgrounds — warm cream base */
  --about-bg:    #F7F2E8;
  --exp-bg:      #F7F1EE;
  --work-bg:     #F2F5E8;
  --contact-bg:  #EEF3F7;

  /* Accent per card */
  --about-acc:   #F5A623;
  --exp-acc:     #FF6B4A;
  --work-acc:    #8FBF00;
  --contact-acc: #4FC4F5;

  /* Edge colours */
  --about-edge:  #E0D5BC;
  --exp-edge:    #E0CFC8;
  --work-edge:   #D0DCAA;
  --contact-edge:#B8D8EC;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--fg);
  overflow: hidden;
  transition: background 0.7s cubic-bezier(0.4,0,0.2,1);
}

/* ── MENU ── */
.menu-btn {
  position: fixed;
  top: 28px; right: 32px;
  z-index: 300;
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px 18px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px; font-weight: 600;
  color: var(--fg-mid);
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.menu-btn:hover { background: rgba(255,255,255,0.09); color: var(--fg); }

.menu-icon { display: flex; flex-direction: column; gap: 4px; }
.menu-icon span {
  display: block; width: 14px; height: 1.5px;
  background: currentColor; border-radius: 2px;
  transition: all 0.22s;
}
.menu-open .menu-icon span:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
.menu-open .menu-icon span:nth-child(2) { opacity: 0; }
.menu-open .menu-icon span:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }

.menu-drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 260px;
  background: #1A1A1A;
  border-left: 1px solid var(--border);
  z-index: 200;
  display: flex; flex-direction: column;
  padding: 88px 36px 36px;
  gap: 4px;
  transform: translateX(100%);
  transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
}
.menu-drawer.open { transform: translateX(0); }

.menu-item {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 30px; font-weight: 700;
  color: var(--fg-mid);
  padding: 10px 0;
  cursor: pointer;
  border: none; background: none;
  text-align: left;
  transition: color 0.15s;
  letter-spacing: -0.03em;
  line-height: 1;
}
.menu-item:hover { color: var(--fg); }
.menu-item.active { color: var(--fg); }

.menu-divider { height: 1px; background: var(--border); margin: 12px 0; }

.menu-contact {
  margin-top: auto;
  font-size: 12px; color: var(--fg-faint);
  line-height: 1.8;
}
.menu-contact a { color: var(--fg-mid); text-decoration: none; transition: color 0.15s; }
.menu-contact a:hover { color: var(--fg); }

/* ── HERO ── */
.hero {
  height: 100vh;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}

/* ── STAGE ── */
.stage {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 48px;
}

/* ── NAV LABELS ── */
.nav-label {
  display: flex; flex-direction: column; gap: 6px;
  cursor: pointer; min-width: 110px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
.nav-label.visible { opacity: 1; pointer-events: auto; }
.nav-label.right { text-align: left; }
.nav-label.left  { text-align: right; }

.nav-dir {
  font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-faint); font-weight: 600;
  font-family: 'Space Grotesk', sans-serif;
}
.nav-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--fg);
  letter-spacing: -0.04em;
  line-height: 1;
  opacity: 0.3;
  transition: opacity 0.2s;
}
.nav-label:hover .nav-title { opacity: 0.85; }

/* ── STACK ── */
.stack-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 28px;
}

.stack {
  position: relative;
  width: 440px; height: 560px;
}

.peek {
  position: absolute; inset: 0;
  border-radius: 12px;
  pointer-events: none;
  transition: opacity 0.3s;
}

.peek-2 { transform: rotate(-4deg); z-index: 1; }
.peek-3 { transform: rotate(5deg);  z-index: 0; }

.front-slot {
  position: absolute; inset: 0;
  z-index: 3;
  border-radius: 12px;
  transform-style: preserve-3d;
}

/* ── CARD ── */
.card {
  width: 100%; height: 100%;
  border-radius: 12px; padding: 40px;
  display: flex; flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Accent stripe top */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  border-radius: 0;
}

.card-about   { background: var(--about-bg);   border: 1px solid rgba(255,255,255,0.6); box-shadow: 2px 2px 0 0 var(--about-edge),   0 28px 56px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.25); }
.card-exp     { background: var(--exp-bg);     border: 1px solid rgba(255,255,255,0.6); box-shadow: 2px 2px 0 0 var(--exp-edge),     0 28px 56px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.25); }
.card-work    { background: var(--work-bg);    border: 1px solid rgba(255,255,255,0.6); box-shadow: 2px 2px 0 0 var(--work-edge),    0 28px 56px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.25); }
.card-contact { background: var(--contact-bg); border: 1px solid rgba(255,255,255,0.6); box-shadow: 2px 2px 0 0 var(--contact-edge), 0 28px 56px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.25); }

.card-about::before   { background: var(--about-acc); }
.card-exp::before     { background: var(--exp-acc); }
.card-work::before    { background: var(--work-acc); }
.card-contact::before { background: var(--contact-acc); }

/* ── CARD CONTENT ── */
.card-eyebrow {
  font-family: 'DM Sans', sans-serif;
  font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; font-weight: 600;
  color: #999; margin-bottom: 20px; flex-shrink: 0;
}

.about-header {
  display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
}

.avatar-wrap {
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(0,0,0,0.06);
  flex-shrink: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}

.about-name-block { display: flex; flex-direction: column; gap: 3px; }

.card-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 32px; font-weight: 700;
  letter-spacing: -0.04em; line-height: 1;
  color: #111;
}

.card-role {
  font-size: 13px; color: #555;
  font-family: 'DM Sans', sans-serif;
}

.card-divider { height: 1px; background: rgba(0,0,0,0.08); margin: 18px 0; flex-shrink: 0; }

.card-bio {
  font-size: 15px; line-height: 1.65;
  color: #444; font-family: 'DM Sans', sans-serif;
}

/* Accent dot before bio */
.card-about   .card-bio::first-letter { color: var(--about-acc); font-weight: 700; font-size: 1.2em; }
.card-exp     .card-bio::first-letter { color: var(--exp-acc); font-weight: 700; font-size: 1.2em; }

/* Contact header */
.contact-header {
  display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
}
.contact-icon-wrap {
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(79,196,245,0.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
}
.contact-text-block { display: flex; flex-direction: column; gap: 4px; }
.lets-talk {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 32px; font-weight: 700;
  letter-spacing: -0.04em; color: #111; line-height: 1;
}
.open-to { font-size: 12px; color: #555; font-family: 'DM Sans', sans-serif; }

/* Sub-cards */
.sub-cards { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }

.sub-card {
  border-radius: 8px; padding: 13px 15px;
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 10px;
  text-decoration: none;
  transition: transform 0.18s cubic-bezier(0.34,1.2,0.64,1),
              box-shadow 0.18s;
  flex: 1; cursor: pointer;
  background: rgba(0,0,0,0.04);
  border: 1px solid rgba(0,0,0,0.07);
}
.sub-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.1);
}

.sub-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 9px; letter-spacing: 0.12em;
  text-transform: uppercase; font-weight: 600;
  color: #888; margin-bottom: 4px;
}
.sub-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; font-weight: 700;
  color: #111; margin-bottom: 3px; line-height: 1.2;
  letter-spacing: -0.02em;
}
.sub-desc {
  font-size: 12px; line-height: 1.5; color: #666;
  font-family: 'DM Sans', sans-serif;
}
.sub-arrow { font-size: 13px; color: #999; flex-shrink: 0; margin-top: 2px; }

/* Card accent label on sub-card */
.card-about   .sub-card:hover { border-color: var(--about-acc); }
.card-exp     .sub-card:hover { border-color: var(--exp-acc); }
.card-work    .sub-card:hover { border-color: var(--work-acc); }
.card-contact .sub-card:hover { border-color: var(--contact-acc); }

/* Card footer */
.card-footer {
  margin-top: 16px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
}
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  font-size: 10px; padding: 4px 10px;
  border-radius: 100px; font-weight: 500;
  background: rgba(0,0,0,0.06); color: #555;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: 0.02em;
}

/* Say hello */
.say-hello {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px; font-weight: 700;
  color: var(--fg-mid);
  border: 1px solid var(--border);
  padding: 11px 22px; border-radius: 6px;
  text-decoration: none;
  transition: all 0.2s;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.say-hello:hover {
  color: var(--fg);
  border-color: rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.05);
}

/* ── FOOTER ── */
footer {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 40px; z-index: 100;
  border-top: 1px solid var(--border);
}
.footer-status {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--fg-mid);
  font-family: 'DM Sans', sans-serif;
}
.dot {
  width: 6px; height: 6px; border-radius: 50%; background: #4ADE80;
  animation: breathe 2.5s ease-in-out infinite;
}
@keyframes breathe { 0%,100%{opacity:1;}50%{opacity:0.35;} }

.footer-links { display: flex; gap: 24px; list-style: none; }
.footer-links a {
  font-size: 12px; color: var(--fg-mid);
  text-decoration: none; transition: color 0.2s;
  font-family: 'DM Sans', sans-serif;
}
.footer-links a:hover { color: var(--fg); }

/* ── ANIMATIONS ── */
@keyframes cardIn  { from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none} }
</style>
</head>

          <div class="sub-desc">Best way to reach me</div>
        </div><span class="sub-arrow">↗</span>
      </a>
      <a href="https://linkedin.com/in/rishi92" target="_blank" class="sub-card" style="text-decoration:none">
        <div style="flex:1">
          <div class="sub-label">LinkedIn</div>
          <div class="sub-title">linkedin.com/in/rishi92</div>
          <div class="sub-desc">Connect professionally</div>
        </div><span class="sub-arrow">↗</span>
      </a>
      <a href="https://figmashort.link/a6rKRT" target="_blank" class="sub-card" style="text-decoration:none">
        <div style="flex:1">
          <div class="sub-label">Portfolio</div>
          <div class="sub-title">figmashort.link/a6rKRT</div>
          <div class="sub-desc">Full portfolio and case studies</div>
        </div><span class="sub-arrow">↗</span>
      </a>
    </div>`;
}

// ── STATE ──
let current = 0, isAnimating = false;
const frontSlot  = document.getElementById('front-slot');
const frontCard  = document.getElementById('front-card');
const peek2      = document.getElementById('peek2');
const peek3      = document.getElementById('peek3');
const prevLabel  = document.getElementById('prev-label');
const nextLabel  = document.getElementById('next-label');
const prevTitle  = document.getElementById('prev-title');
const nextTitle  = document.getElementById('next-title');
const menuBtn    = document.getElementById('menu-btn');
const menuDrawer = document.getElementById('menu-drawer');
const menuItems  = document.querySelectorAll('.menu-item');

function updatePeekColors() {
  const n2 = (current + 1) % sections.length;
  const n3 = (current + 2) % sections.length;
  peek2.style.background = peekColors[sections[n2].id];
  peek3.style.background = peekColors[sections[n3].id];
}

function updateLabels() {
  const hasPrev = current > 0;
  const hasNext = current < sections.length - 1;
  prevLabel.classList.toggle('visible', hasPrev);
  nextLabel.classList.toggle('visible', hasNext);
  if (hasPrev) prevTitle.textContent = sections[current - 1].label;
  if (hasNext) nextTitle.textContent = sections[current + 1].label;
}

function updateMenu() {
  menuItems.forEach(m => {
    const tIdx = parseInt(m.dataset.idx);
    m.classList.toggle('active', sections[current].group === sections[tIdx].group);
  });
}

function renderFront() {
  frontCard.className = `card ${sections[current].cls}`;
  frontCard.innerHTML = cardHTML(current);
}

function goTo(idx) {
  if (idx < 0 || idx >= sections.length || idx === current || isAnimating) return;
  isAnimating = true;
  const dir = idx > current ? 1 : -1;

  // Hide peeks instantly
  peek2.style.transition = 'opacity 0.15s';
  peek3.style.transition = 'opacity 0.15s';
  peek2.style.opacity = '0';
  peek3.style.opacity = '0';

  removeTilt();
  frontSlot.style.transition = 'transform 0.3s cubic-bezier(0.4,0,0.6,1), opacity 0.25s';
  frontSlot.style.transform = `translateX(${dir * -120}%) rotate(${dir * -8}deg)`;
  frontSlot.style.opacity = '0';

  current = idx;
  updateLabels(); updateMenu();
  menuDrawer.classList.remove('open');
  menuBtn.classList.remove('menu-open');

  setTimeout(() => {
    renderFront();
    frontSlot.style.transition = 'none';
    frontSlot.style.transform = `translateX(${dir * 70}%) rotate(${dir * 5}deg)`;
    frontSlot.style.opacity = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      frontSlot.style.transition = 'transform 0.42s cubic-bezier(0.34,1.08,0.64,1), opacity 0.28s';
      frontSlot.style.transform = '';
      frontSlot.style.opacity = '1';
      setTimeout(() => {
        addTilt();
        isAnimating = false;
        updatePeekColors();
        peek2.style.transition = 'opacity 0.35s';
        peek3.style.transition = 'opacity 0.35s';
        peek2.style.opacity = '1';
        peek3.style.opacity = '1';
      }, 420);
    }));
  }, 260);
}

prevLabel.addEventListener('click', () => goTo(current - 1));
nextLabel.addEventListener('click', () => goTo(current + 1));

menuBtn.addEventListener('click', () => {
  const open = menuDrawer.classList.toggle('open');
  menuBtn.classList.toggle('menu-open', open);
});

menuItems.forEach(item => {
  item.addEventListener('click', () => goTo(parseInt(item.dataset.idx)));
});

// ── HOVER — gentle float lift ──
function addTilt() {
  const card = frontCard;
  card._enter = () => {
    card.style.transition = 'transform 0.45s cubic-bezier(0.34,1.1,0.64,1)';
    card.style.transform = 'translateY(-10px) scale(1.015)';
  };
  card._leave = () => {
    card.style.transition = 'transform 0.4s cubic-bezier(0.4,0,0.2,1)';
    card.style.transform = '';
  };
  card.addEventListener('mouseenter', card._enter);
  card.addEventListener('mouseleave', card._leave);
}

function removeTilt() {
  const card = frontCard;
  if (card._enter) card.removeEventListener('mouseenter', card._enter);
  if (card._leave) card.removeEventListener('mouseleave', card._leave);
  card.style.transition = '';
  card.style.transform = '';
}

// Init
renderFront();
updatePeekColors();
updateLabels();
addTilt();
</script>
</body>
